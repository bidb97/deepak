                                tokenIdsByFile[entry.name] = ids;
                            } catch (e) {}
                        }

                        for (const lang of languages.value) {
                            const langDir = await langRoot.getDirectoryHandle(lang, { create: true });
                            const legacyFileHandle = await langDir.getFileHandle('tokens.json', { create: false }).catch(() => null);
                            if (!legacyFileHandle) continue;

                            let legacyMap = {};
                            try {
                                const legacyFile = await legacyFileHandle.getFile();
                                const legacyText = await legacyFile.text();
                                legacyMap = legacyText.trim() ? JSON.parse(legacyText) : {};
                            } catch (e) {
                                legacyMap = {};
                            }

                            const perFileDir = await langDir.getDirectoryHandle('tokens', { create: true });
                            for (const [fileName, ids] of Object.entries(tokenIdsByFile)) {
                                const perFileHandle = await perFileDir.getFileHandle(fileName, { create: true });
                                let perFileMap = {};
                                try {
                                    const perFile = await perFileHandle.getFile();
                                    const perText = await perFile.text();
                                    perFileMap = perText.trim() ? JSON.parse(perText) : {};
                                } catch (e) {
                                    perFileMap = {};
                                }

                                let changed = false;
                                for (const id of ids) {
                                    if (perFileMap[id] === undefined && legacyMap[id] !== undefined) {
                                        perFileMap[id] = legacyMap[id];
                                        changed = true;
                                    }
                                }
                                if (changed) {
                                    const writable = await perFileHandle.createWritable();
                                    await writable.write(JSON.stringify(perFileMap, null, 2));
                                    await writable.close();
                                }
                            }
                        }
                    } catch (e) {
                        console.error('Ошибка миграции legacy-переводов:', e);
                    }
                };

                return {
                    currentTab,
                    tabTitle,
                    dirHandle,
                    tokenFiles,
                    scenarioFiles,
                    users,
                    selectProjectFolder,
                    selectedFile,
                    categoryNames,
                    visualDataEntries,
                    visualData,
                    newTokenInputs,
                    saveMessage,
                    languages,
                    translations,
                    showCreateGroupModal,
                    showImportModal,
                    showAddTokenModal,
                    showCreateSubcategoryModal,
                    showEditTitleModal,
                    massImportJson,
                    importSubcategory,
                    newGroupFileName,
                    newGroupTitle,
                    newGroupHasSubcategories,
                    newGroupTokenScope,
                    newTokenModalDraft,
                    newSubcategorySlug,
                    newSubcategoryTitle,
                    editTitleHeading,
                    editTitleValues,
                    importSubcategoryOptions,
                    fileHasSubcategories,
                    addLanguage,
                    openLanguagesModal,
                    showLanguagesModal,
                    newLanguageCode,
                    visibleLanguageList,
                    primaryLanguage,
                    subcategoryMeta,
                    isLanguageVisible,
                    toggleLanguageVisibility,
                    openMassiveImport,
                    openCreateGroupModal,
                    createTokenGroup,
                    applyMassiveImport,
                    selectFile,
                    saveFile,
                    removeToken,
                    moveToken,
                    toggleTokenActive,
                    openAddTokenModal,
                    updateTokenDraftValue,
                    createTokenAfterCard,
                    openCreateSubcategoryModal,
                    createSubcategoryFromModal,
                    openEditGroupTitleModal,
                    openEditSubcategoryTitleModal,
                    updateEditTitleValue,
                    saveEditedTitle,
                    clearFileTokens,
                    clearSubcategoryTokens,
                    toggleFileActive,
                    toggleSubcategoryActive,
                    deleteSubcategory,
                    deleteFileRow
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
